[package]
name = "adiantum"
version = "0.2.0"
edition = "2021"
description = "A Rust implementation of the Adiantum cipher, a fast encryption scheme optimized for mobile and embedded devices, designed by Google."
license = "MIT"
keywords = ["cryptography", "cipher", "encryption", "decryption", "adiantum"]
categories = ["cryptography", "no-std", "embedded"]
homepage = "https://github.com/vlad9486/adiantum"
repository = "https://github.com/vlad9486/adiantum"
readme = "README.md"
rust-version = "1.61"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
hex = { version = "0.4.3" }
chacha20 = { version = "0.10.0", default-features = false, features = ["xchacha"] }
aes = { version = "0.9.0", default-features = false }

[dependencies]
cipher = { version = "0.5.1" }
poly1305 = { version = "0.9.0-rc.6", default-features = false }
rustversion = { version = "1.0.22" }
zeroize = { version = "1.8" }
